# Render blueprint: one web service + one managed PostgreSQL database.
# Deploy with "New +" → "Blueprint" and point Render at this repository.
databases:
  - name: business-card-db
    plan: free
    databaseName: business_card
    user: business_card

services:
  - type: web
    name: business-card-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: business-card-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SEED_ON_START
        value: 'true'
